apiVersion: guardian/v1alpha1
kind: Partition
metadata:
  name: strata-local
  labels:
    role: ai-agent
spec:
  deletionPolicy: orphan
  reconciliation:
    mode: manual
    interval: 1m
  labels:
    stack: local
    component: strata
    topology: docker-host
    managedBy: external-compose
    endpoint: http://host.docker.internal:3000
