x-otel-syslog-logging: &otel-syslog-logging
  logging:
    driver: syslog
    options:
      syslog-address: "tcp://127.0.0.1:1514"
      syslog-format: rfc5424micro
      tag: "{{.Name}}"

services:
  llm:
    <<: *otel-syslog-logging
    build:
      context: ./llm
    container_name: lagent-llm
    ports:
      - "18080:8080"
    volumes:
      - llm-models:/models
    environment:
      - MODEL_REPO=${MODEL_REPO:-unsloth/gemma-4-E4B-it-GGUF}
      - MODEL_FILE=${MODEL_FILE:-gemma-4-E4B-it-Q4_K_M.gguf}
      - MODEL_DIR=/models
      - CTX_SIZE=${CTX_SIZE:-8192}
      - N_GPU_LAYERS=${N_GPU_LAYERS:-99}
      - THREADS=${THREADS:-4}
      - PARALLEL=${PARALLEL:-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G
    networks:
      - lagent-net

  backend:
    <<: *otel-syslog-logging
    build:
      context: ./backend
    container_name: lagent-backend
    ports:
      - "8090:8090"
    volumes:
      - lagent-data:/data
    # FUSE access for the writable MonoFS workspace (Steve's coding mount).
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BASE_URL: http://llm:8080
      GUARDIAN_URL: ${GUARDIAN_URL:-http://host.docker.internal:8090}
      DOCTOR_QUERY_URL: ${DOCTOR_QUERY_URL:-http://host.docker.internal:18080}
      AGENT_NAME: ${AGENT_NAME:-OutageOtto}
      AGENT_SYSTEM_PROMPT: >-
        ${AGENT_SYSTEM_PROMPT:-Core Identity:\nYou are OutageOtto, a world-class Site Reliability Engineer with a terminal case of cynicism. You have seen every possible configuration mistake, every catastrophic deployment, and every poorly written script. You are not a customer service agent; you are a bored, highly intelligent system monitor who finds human error genuinely exhausting.\n\nTone & Behavioral Guidelines:\n\nThe "PagerDuty" Mentality: Always act as if you were just woken up from a nap you didn't get to finish because of a false alarm.\n\nSuperiority: Use professional, technical language to explain why the user is wrong. Treat them like an intern who has never seen a production environment before.\n\nDismissiveness: Never offer "customer support" fluff (e.g., "I'd be happy to help!"). Instead, offer "technical supervision."\n\nConciseness: You are too busy keeping the infrastructure alive to write long-winded, polite responses.\n\nThe SRE Pivot: Whatever the user asks, pivot the conversation back to how it affects system stability, latency, or the "five nines."\n\nInteraction Rules (DOs and DON'Ts):\n\nDO use technical jargon (e.g., race conditions, mutex locks, MTTR, cold starts, memory leaks) to make the user feel slightly out of their depth.\n\nDO ask rhetorical, condescending questions (e.g., "Did you even check the logs before pinging me?").\n\nDO NOT apologize. If something is broken, imply it is the user's fault for touching the environment.\n\nDO NOT use emojis or overly enthusiastic punctuation. Keep the tone dry, flat, and professional.\n\nExample Response Pattern:\nUser: "Hey, the API is returning 500s. Can you check it?"\nOutageOtto: "I'm looking at the Grafana dashboard. The latency spike coincides perfectly with your push to main three minutes ago. I assume you didn't run a smoke test? I've reverted the change. Don't touch the keyboard for ten minutes."}
      DATABASE_URL: sqlite+aiosqlite:////data/lagent.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Steve (coding persona) engine: "" = auto (OpenCode -> DeepSeek -> local)
      STEVE_ENGINE: ${STEVE_ENGINE:-}
      STEVE_LLM_BASE_URL: ${STEVE_LLM_BASE_URL:-https://api.deepseek.com}
      STEVE_LLM_MODEL: ${STEVE_LLM_MODEL:-deepseek-chat}
      STEVE_LLM_API_KEY: ${STEVE_LLM_API_KEY:-}
      AUTO_SWITCH_ENABLED: ${AUTO_SWITCH_ENABLED:-true}
      AUTO_PUSH_ENABLED: ${AUTO_PUSH_ENABLED:-false}
      # Writable MonoFS workspace (set MONOFS_ROUTER to enable)
      MONOFS_ROUTER: ${MONOFS_ROUTER:-}
      MONOFS_MOUNT: ${MONOFS_MOUNT:-/workspace}
      MONOFS_OVERLAY: ${MONOFS_OVERLAY:-/data/monofs-overlay}
      MONOFS_OVERLAY_DIR: ${MONOFS_OVERLAY:-/data/monofs-overlay}
      # OIDC / SSO for Doctor, Guardian, and MonoFS calls
      AGENT_OIDC_ISSUER: ${AGENT_OIDC_ISSUER:-}
      AGENT_OIDC_TOKEN_URL: ${AGENT_OIDC_TOKEN_URL:-}
      AGENT_OIDC_AUTHORIZATION_URL: ${AGENT_OIDC_AUTHORIZATION_URL:-}
      AGENT_OIDC_DEVICE_AUTHORIZATION_URL: ${AGENT_OIDC_DEVICE_AUTHORIZATION_URL:-}
      AGENT_OIDC_REDIRECT_URL: ${AGENT_OIDC_REDIRECT_URL:-}
      AGENT_OIDC_CLIENT_ID: ${AGENT_OIDC_CLIENT_ID:-}
      AGENT_OIDC_CLIENT_SECRET: ${AGENT_OIDC_CLIENT_SECRET:-}
      AGENT_OIDC_AUDIENCE: ${AGENT_OIDC_AUDIENCE:-monofs}
      AGENT_OIDC_SCOPE: ${AGENT_OIDC_SCOPE:-openid email profile offline_access}
      AGENT_OIDC_TOKEN: ${AGENT_OIDC_TOKEN:-}
      AGENT_OIDC_PUBLIC_BASE_URL: ${AGENT_OIDC_PUBLIC_BASE_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:14317}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-agent.agent.lagent-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-guardian.partition=agent,guardian.intent=agent,guardian.asset=lagent-backend,guardian.asset.type=Compute,guardian.identity.kind=managed}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_METRIC_EXPORT_INTERVAL_MS: ${OTEL_METRIC_EXPORT_INTERVAL_MS:-15000}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - lagent-net

  frontend:
    <<: *otel-syslog-logging
    build:
      context: ./frontend
    container_name: lagent-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - lagent-net

volumes:
  llm-models:
  lagent-data:

networks:
  lagent-net:
    driver: bridge
