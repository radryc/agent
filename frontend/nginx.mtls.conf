# HTTPS variant of nginx.conf, used by docker-compose.mtls.yml.
#
# The browser-facing segment stays plain HTTP on port 3000; only the nginx ->
# backend hop is TLS. The backend certificate is verified against the Strata
# CA mounted at /var/run/secrets/strata-tls/ca.crt, and SNI/name verification
# uses LAGENT_TLS_SERVER_NAME (default: agent, which tlsx puts in the
# certificate's SANs).
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API proxy over TLS
    location /api/ {
        proxy_pass https://${LAGENT_BACKEND_HOST}:8090;
        proxy_ssl_server_name on;
        proxy_ssl_name ${LAGENT_TLS_SERVER_NAME};
        proxy_ssl_trusted_certificate /var/run/secrets/strata-tls/ca.crt;
        proxy_ssl_verify on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket proxy over TLS
    location /ws/ {
        proxy_pass https://${LAGENT_BACKEND_HOST}:8090;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ${LAGENT_TLS_SERVER_NAME};
        proxy_ssl_trusted_certificate /var/run/secrets/strata-tls/ca.crt;
        proxy_ssl_verify on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
